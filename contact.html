<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Contact Us - Dummy Bakery</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- Header -->

<header>

    <div class="container navbar">

        <div class="logo">
            <!-- Logo -->
            <img src="png/logo-dummy.png" alt="logo">
        </div>

        <nav class="nav-links">

            <a href="index.html">Home</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html">Contact Us</a>
            <a href="blog.html">Blog</a>

        </nav>

    </div>

</header>


<!-- Main -->

<main class="contact-section">

    <div class="container">

        <section class="intro">

            <h1>Contact Us</h1>

            <h2>We would love to hear from you!!😊</h2>

            <p>
                📝Share your thoughts and queries with us📝
            </p>

        </section>


        <section class="contact-form">

            <form>

                <p>
                    <label for="first-name">
                        First Name:- <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="first-name"
                        name="first-name"
                        required
                    >
                </p>


                <p>
                    <label for="last-name">
                        Last Name:- <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="last-name"
                        name="last-name"
                        required
                    >
                </p>


                <p>
                    <label for="mobile">
                        Mobile:- <span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        required
                    >
                </p>


                <p>
                    <label for="email">
                        Email:- <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </p>


                <p>
                    <label for="date">
                        Requirement Date & Time:-
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                    >

                    <select name="hour" id="hour">
                        <option value="01">01</option>
                        <option value="02">02</option>
                        <option value="03">03</option>
                        <option value="04">04</option>
                        <option value="05">05</option>
                        <option value="06">06</option>
                        <option value="07">07</option>
                        <option value="08">08</option>
                        <option value="09">09</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>

                    <select name="minute" id="minute">
                        <option value="00">00</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="45">45</option>
                    </select>

                    <select name="ampm" id="ampm">
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                </p>


                <p>
                    <label for="city">
                        City:- <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        required
                    >
                </p>


                <p>
                    <label for="zip">
                        Zip Code:- <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="zip"
                        name="zip"
                        required
                    >
                </p>


                <p>

                    <button type="submit">
                        SUBMIT
                    </button>

                    <button type="reset">
                        RESET
                    </button>

                </p>

            </form>

        </section>

    </div>

</main>


<!-- =========================
     FOOTER
========================== -->

<footer>

    <div class="container">

        <p>
            © 2026 DUMMY BAKERY | Freshly Baked, Made With Love
        </p>

    </div>

</footer>
```

</body>

</html>
